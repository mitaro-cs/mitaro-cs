<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 129.95282500000002 30" width="129.95282500000002" height="30" role="img" aria-label="Telegram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Telegram</title><defs><style>text{font-variant-numeric:tabular-nums}.lift,.roll,.fade,.wide,.grow,.packet,.pulse,.type,.shine,.wave,.ripple,.draw{animation-delay:var(--t,0s)}@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}.draw{animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}@keyframes lift{from{transform:translateY(var(--dy))}to{transform:none}}.lift{animation:lift 1s cubic-bezier(.2,.8,.2,1) both}@keyframes roll{from{transform:translateY(var(--from))}to{transform:none}}.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .7s ease-out both}@keyframes wide{from{transform:scaleX(0)}to{transform:none}}.wide{transform-box:fill-box;transform-origin:0 50%;animation:wide 1s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scale(0)}to{transform:none}}.grow{transform-box:view-box;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes spin{to{transform:rotate(360deg)}}.sweep{transform-box:view-box;animation:spin 14s linear infinite}@keyframes flow{from{stroke-dashoffset:var(--start)}to{stroke-dashoffset:var(--end)}}.packet{animation:flow 2.6s cubic-bezier(.45,0,.55,1) infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes tick{to{transform:translateX(var(--shift))}}.ticker{animation:tick var(--d) linear infinite}@keyframes type{from{transform:translateX(var(--dx))}to{transform:none}}.type{animation:type var(--d,1s) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}.rest{opacity:0}@keyframes shine{0%{transform:translateX(var(--from))}40%,100%{transform:translateX(var(--to))}}.shine{animation:shine 6s cubic-bezier(.45,0,.55,1) infinite}@keyframes wave{0%,100%{opacity:1}50%{opacity:.4}}.wave{animation:wave 3.6s ease-in-out infinite}@keyframes ripple{0%{transform:scale(.15);opacity:.9}75%,100%{transform:scale(1);opacity:0}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.6s cubic-bezier(.2,.7,.3,1) infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:view-box;transform-origin:0 0;animation:orbit 10s linear infinite}@keyframes depth{0%,40%{opacity:1}50%,90%{opacity:.15}100%{opacity:1}}.depth{animation:depth 10s linear infinite}@keyframes ping{0%{transform:scale(.4);opacity:.8}70%,100%{transform:scale(1.6);opacity:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}@keyframes glide{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%,100%{transform:translateX(var(--w));opacity:0}}.glide{opacity:0;animation:glide 7s cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--t,1.5s)}@keyframes twinkle{0%,100%{opacity:var(--o,.5)}50%{opacity:.08}}.twinkle{animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--t,0s)}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.pop{animation:pop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--t,0s)}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.bob{animation:bob 3.2s ease-in-out infinite;animation-delay:var(--t,0s)}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}</style><clipPath id="gc1"><rect x="0.0" y="0.0" width="130.0" height="30.0" rx="5"/></clipPath><linearGradient id="gb2"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g class="pop" style="--t:0.00s"><rect x="0.5" y="0.5" width="129.0" height="29.0" fill="#0b0b0b" rx="5" stroke="#333333" stroke-width="1" /><path d="M11.944 0A1