<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 330" width="888" height="330" role="img" aria-label="Timeline of my GitHub projects"><title>Timeline of my GitHub projects</title><defs><style>@font-face{font-family:JBMono;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:JBMono;font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}.o{transform-box:fill-box;transform-origin:center}@keyframes wob{0%{transform:rotate(calc(var(--a,1.3deg)*-1)) translate(0,0)}34%{transform:rotate(calc(var(--a,1.3deg)*.8)) translate(.8px,-.7px)}67%{transform:rotate(calc(var(--a,1.3deg)*-.4)) translate(-.7px,.6px)}}.wob{animation:wob var(--d,1s) steps(1) infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 3.4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}.sway{transform-origin:50% 0;animation:sway 5.5s ease-in-out infinite}@keyframes pop{0%{transform:scale(.7) rotate(-7deg)}65%{transform:scale(1.07) rotate(1.2deg)}100%{transform:scale(1) rotate(0deg)}}.pop{animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}@keyframes grow{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.grow{transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{transform:translateY(10px)}to{transform:translateY(0)}}.rise{animation:rise .6s ease-out both}@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 9s linear infinite}@keyframes draw{from{stroke-dashoffset:calc(var(--len)*.86)}to{stroke-dashoffset:0}}.draw{stroke-dasharray:var(--len);animation:draw 1.6s ease-out both}@keyframes marq{to{transform:translateX(var(--shift))}}.marq{animation:marq 18s linear infinite}@keyframes fA{0%,49.99%{opacity:1}50%,100%{opacity:0}}@keyframes fB{0%,49.99%{opacity:0}50%,100%{opacity:1}}.fA{animation:fA .8s steps(1) infinite}.fB{animation:fB .8s steps(1) infinite}@keyframes sweep{0%{transform:translateX(0)}42%,100%{t