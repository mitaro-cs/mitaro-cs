ezier(.45,0,.55,1) infinite}@keyframes wave{0%,100%{opacity:1}50%{opacity:.4}}.wave{animation:wave 3.6s ease-in-out infinite}@keyframes ripple{0%{transform:scale(.15);opacity:.9}75%,100%{transform:scale(1);opacity:0}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.6s cubic-bezier(.2,.7,.3,1) infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:view-box;transform-origin:0 0;animation:orbit 10s linear infinite}@keyframes depth{0%,40%{opacity:1}50%,90%{opacity:.15}100%{opacity:1}}.depth{animation:depth 10s linear infinite}@keyframes ping{0%{transform:scale(.4);opacity:.8}70%,100%{transform:scale(1.6);opacity:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}@keyframes glide{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%,100%{transform:translateX(var(--w));opacity:0}}.glide{opacity:0;animation:glide 7s cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--t,1.5s)}@keyframes twinkle{0%,100%{opacity:var(--o,.5)}50%{opacity:.08}}.twinkle{animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--t,0s)}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.pop{animation:pop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--t,0s)}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.bob{animation:bob 3.2s ease-in-out infinite;animation-delay:var(--t,0s)}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}</style><clipPath id="gc1"><rect x="0.0" y="0.0" width="136.7" height="30.0" rx="5"/></clipPath><linearGradient id="gb2"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g class="pop" style="--t:0.00s"><rect x="0.5" y="0.5" width="135.7" height="29.0" fill="#0b0b0b" rx="5" stroke="#333333" stroke-width="1" /><path d="M7.0301.084c-1.2768.0602-