<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 342" width="440" height="342" role="img" aria-label="05 Now: building Java and Flask backends with a cleaner structure; studying security: encryption, hashing, local-first design; prototype a personal AI assistant, Jarvis-style; student computer science at MTUCI." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>05 Now: building Java and Flask backends with a cleaner structure; studying security: encryption, hashing, local-first design; prototype a personal AI assistant, Jarvis-style; student computer science at MTUCI.</title><desc>A terminal that types out what I am working on now, with a spinner on the current build.</desc><defs><style>text{font-variant-numeric:tabular-nums}.lift,.roll,.fade,.wide,.grow,.packet,.pulse,.type,.shine,.wave,.ripple,.draw{animation-delay:var(--t,0s)}@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}.draw{animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}@keyframes lift{from{transform:translateY(var(--dy))}to{transform:none}}.lift{animation:lift 1s cubic-bezier(.2,.8,.2,1) both}@keyframes roll{from{transform:translateY(var(--from))}to{transform:none}}.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .7s ease-out both}@keyframes wide{from{transform:scaleX(0)}to{transform:none}}.wide{transform-box:fill-box;transform-origin:0 50%;animation:wide 1s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scale(0)}to{transform:none}}.grow{transform-box:view-box;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes spin{to{transform:rotate(360deg)}}.sweep{transform-box:view-box;animation:spin 14s linear infinite}@keyframes flow{from{stroke-dashoffset:var(--start)}to{stroke-dashoffset:var(--end)}}.packet{animation:flow 2.6s cubic-bezier(.45,0,.55,1) infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes tick{to{transform:translateX(var(--shift))}}.ticker{animation:tick var(--d) linear infinite}@keyframes type{from{transform:translateX(var(--dx))}to{transform:none}}.type{animation:type var(--d,1s) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}.rest{opacity:0}@keyframes shine{0%{transform:translateX(var(--from))}40%,100%{transform:translateX(var(--to))}}.shine{animation:shine 6s cubic-bezier(.45,0,.55,1) infinite}@keyframes wave{0%,100%{opacity:1}50%{opacity:.4}}.wave{animation:wave 3.6s ease-in-out infinite}@keyframes ripple{0%{transform:scale(.15);opacity:.9}75%,100%{transform:scale(1);opacity:0}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.6s cubic-bezier(.2,.7,.3,1) infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:view-box;transform-origin:0 0;animation:orbit 10s linear infinite}@keyframes depth{0%,40%{opacity:1}50%,90%{opacity:.15}100%{opacity:1}}.depth{animation:depth 10s linear infinite}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}@keyframes f4x600{0%,25.000%{opacity:1}25.001%,100%{opacity:0}}@media (prefers-reduced-motion:no-preference){.f4x600{opacity:0;animation:f4x600 0.6s steps(1) infinite}}</style><clipPath id="ty1"><rect x="37.0" y="85.0" width="129.0" height="18.8"/></clipPath><clipPath id="ty2"><rect x="37.0" y="109.0" width="339.6" height="18.8"/></clipPath><clipPath id="ty3"><rect x="37.0" y="133.0" width="238.2" height="18.8"/></clipPath><clipPath id="ty4"><rect x="37.0" y="157.0" width="339.6" height="18.8"/></clipPath><clipPath id="ty5"><rect x="37.0" y="181.0" width="246.0" height="18.8"/></clipPath><clipPath id="ty6"><rect x="37.0" y="205.0" width="292.8" height="18.8"/></clipPath><clipPath id="ty7"><rect x="37.0" y="229.0" width="199.2" height="18.8"/></clipPath><clipPath id="ty8"><rect x="37.0" y="253.0" width="300.6" height="18.8"/></clipPath></defs><rect x=