<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-label="03 Map: my repositories as a constellation, in the order I made them; the higher and larger the star, the more commits. Mouros 5, AetherCloud 7, VantaVault 16, Kworking 5, Java 1, Python 1, Campus 101, mitaro-cs 19, obsidian 4, Albion-Online-Fishing-Bot 1." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>03 Map: my repositories as a constellation, in the order I made them; the higher and larger the star, the more commits. Mouros 5, AetherCloud 7, VantaVault 16, Kworking 5, Java 1, Python 1, Campus 101, mitaro-cs 19, obsidian 4, Albion-Online-Fishing-Bot 1.</title><desc>Stars twinkle and a line draws itself through them from the first repository to the newest.</desc><defs><style>text{font-variant-numeric:tabular-nums}.lift,.roll,.fade,.wide,.grow,.packet,.pulse,.type,.shine,.wave,.ripple,.draw{animation-delay:var(--t,0s)}@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}.draw{animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}@keyframes lift{from{transform:translateY(var(--dy))}to{transform:none}}.lift{animation:lift 1s cubic-bezier(.2,.8,.2,1) both}@keyframes roll{from{transform:translateY(var(--from))}to{transform:none}}.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .7s ease-out both}@keyframes wide{from{transform:scaleX(0)}to{transform:none}}.wide{transform-box:fill-box;transform-origin:0 50%;animation:wide 1s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scale(0)}to{transform:none}}.grow{transform-box:view-box;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes spin{to{transform:rotate(360deg)}}.sweep{transform-box:view-box;animation:spin 14s linear infinite}@keyframes flow{from{stroke-dashoffset:var(--start)}to{stroke-dashoffset:var(--end)}}.packet{animation:flow 2.6s cubic-bezier(.45,0,.55,1) infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes tick{to{transform:translateX(var(--shift))}}.ticker{animation:tick var(--d) linear infinite}@keyframes type{from{transform:translateX(var(--dx))}to{transform:none}}.type{animation:type var(--d,1s) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}.rest{opacity:0}@keyframes shine{0%{transform:translateX(var(--from))}40%,100%{transform:translateX(var(--to))}}.shine{animation:shine 6s cubic-bezier(.45,0,.55,1) infinite}@keyframes wave{0%,100%{opacity:1}50%{opacity:.4}}.wave{animation:wave 3.6s ease-in-out infinite}@keyframes ripple{0%{transform:scale(.15);opacity:.9}75%,100%{transform:scale(1);opacity:0}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.6s cubic-bezier(.2,.7,.3,1) infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:view-box;transform-origin:0 0;animation:orbit 10s linear infinite}@keyframes depth{0%,40%{opacity:1}50%,90%{opacity:.15}100%{opacity:1}}.depth{animation:depth 10s linear infinite}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}</style></defs><rect x="0.0" y="0.0" width="440.0" height="470.0" fill="#11110f" /><circle cx="281.3" cy="65.4" r="0.8" fill="#c2b8ab" opacity="0.26" /><circle cx="61.4" cy="94.3" r="1.1" fill="#c2b8ab" opacity="0.55" /><circle cx="38.3" cy="213.8" r="0.6" fill="#c2b8ab" opacity="0.19" /><circle cx="102.4" cy="281.2" r="1.1" fill="#c2b8ab" opacity="0.24" /><circle cx="285.9" cy="259.8" r="0.6" fill="#c2b8ab" opacity="0.35" /><circle cx="122.4" cy="381.1" r="0.6" fill="#c2b8ab" opacity="0.46" /><circle cx="149.7" cy="114.1" r="0.8" fill="#c2b8ab" opacity="0.2" /><circle cx="167.2" cy="190.3" r="0.8" fill="#c2b8ab" opacity="0.42" /><circle cx="355.1" cy="328.9" r="1.1" fill="#c2b8ab" opacity="0.21" /><circle cx="405.8" cy="85.5" r="0.8" fill="#c2b8ab" opacity