<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 98" width="888" height="98" role="img" aria-label="BEFORE YOU FOLLOW: I commit at odd hours (35% after 22:00), in Russian and English, mostly Java and Svelte. DON'T FOLLOW IF: you keep passwords in plain text, trust only the cloud, or think readable code is for beginners." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace"><title>BEFORE YOU FOLLOW: I commit at odd hours (35% after 22:00), in Russian and English, mostly Java and Svelte. DON'T FOLLOW IF: you keep passwords in plain text, trust only the cloud, or think readable code is for beginners.</title><defs><style>@keyframes rain{from{transform:translateY(var(--from))}to{transform:translateY(var(--to))}}.rain{animation:rain var(--d) linear infinite;animation-delay:var(--delay)}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes flick{0%,100%{opacity:1}4%{opacity:.7}6%{opacity:1}48%{opacity:.9}50%{opacity:1}}.flick{animation:flick 5s steps(1) infinite}@keyframes rise{from{opacity:0}to{opacity:1}}.rise{animation:rise .6s steps(4) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s steps(12) both}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}</style></defs><rect x="0.0" y="0.0" width="888.0" height="98.0" fill="#010602" rx="4" /><rect x="3.0" y="3.0" width="882.0" height="92.0" fill="none" stroke="#d7e8d9" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="14.0" y="14.0" width="424.0" height="70.0" fill="#030d05" stroke="#1e7a32" stroke-width="1.5" /><rect x="14.0" y="14.0" width="424.0" height="20.0" fill="#0a2410" stroke="#1e7a32" stroke-width="1.2" /><text x="20.0" y="28.0" font-size="11" fill="#e3f5e6" font-weight="700">BEFORE YOU FOLLOW</text><text x="22.0" y="52.0" font-size="12" fill="#e3f5e6">I commit at odd hours (35% after 22:00), in Russian and</text><text x="22.0" y="69.0" font-size="12" fill="#e3f5e6">English, mostly Java and Svelte.</text><rect x="450.0" y="14.0" width="424.0" height="70.0" fill="#030d05" stroke="#1e7a32" stroke-width="1.5" /><rect x="450.0" y="14.0" width="424.0" height="20.0" fill="#0a2410" stroke="#1e7a32" stroke-width="1.2" /><text x="456.0" y="28.0" font-size="11" fill="#e3f5e6" font-weight="700">DON'T FOLLOW IF</text><text x="458.0" y="52.0" font-size="12" fill="#e3f5e6">you keep passwords in plain text, trust only the cloud,</text><text x="458.0" y="69.0" font-size="12" fill="#e3f5e6">or think readable code is for beginners.</text></svg>