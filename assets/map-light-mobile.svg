<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-label="03 Map: my repositories as a constellation, in the order I made them; the higher and larger the star, the more commits. Mouros 5, AetherCloud 7, VantaVault 16, Kworking 5, Java 1, Python 1, Campus 102, mitaro-cs 19, obsidian 5, Albion-Online-Fishing-Bot 1." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>03 Map: my repositories as a constellation, in the order I made them; the higher and larger the star, the more commits. Mouros 5, AetherCloud 7, VantaVault 16, Kworking 5, Java 1, Python 1, Campus 102, mitaro-cs 19, obsidian 5, Albion-Online-Fishing-Bot 1.</title><desc>Stars twinkle, shooting stars cross the sky, and a line draws itself through the repositories from the first to the newest, with a light running along it.</desc><defs><style>text{font-variant-numeric:tabular-nums}.lift,.roll,.fade,.wide,.grow,.packet,.pulse,.type,.shine,.wave,.ripple,.draw{animation-delay:var(--t,0s)}@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}.draw{animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}@keyframes lift{from{transform:translateY(var(--dy))}to{transform:none}}.lift{animation:lift 1s cubic-bezier(.2,.8,.2,1) both}@keyframes roll{from{transform:translateY(var(--from))}to{transform:none}}.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .7s ease-out both}@keyframes wide{from{transform:scaleX(0)}to{transform:none}}.wide{transform-box:fill-box;transform-origin:0 50%;animation:wide 1s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scale(0)}to{transform:none}}.grow{transform-box:view-box;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes spin{to{transform:rotate(360deg)}}.sweep{transform-box:view-box;animation:spin 14s linear infinite}@keyframes flow{from{stroke-dashoffset:var(--start)}to{s