ansform:translateX(var(--shift))}}.ticker{animation:tick var(--d) linear infinite}@keyframes type{from{transform:translateX(var(--dx))}to{transform:none}}.type{animation:type var(--d,1s) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}.rest{opacity:0}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}</style><clipPath id="ty1"><rect x="19.0" y="78.5" width="376.5" height="19.6"/></clipPath><clipPath id="ty2"><rect x="19.0" y="104.5" width="376.5" height="19.6"/></clipPath><clipPath id="ty3"><rect x="19.0" y="130.5" width="376.5" height="19.6"/></clipPath><clipPath id="ty4"><rect x="19.0" y="156.5" width="376.5" height="19.6"/></clipPath><clipPath id="ty5"><rect x="19.0" y="182.5" width="376.5" height="19.6"/></clipPath><clipPath id="ty6"><rect x="19.0" y="208.5" width="376.5" height="19.6"/></clipPath></defs><rect x="0.0" y="0.0" width="440.0" height="572.0" fill="#efebe3" /><text x="20.0" y="42.0" font-size="13.5" fill="#3f6273" font-weight="700" letter-spacing="1.5" >03</text><text x="54.0" y="42.0" font-size="13.5" fill="#1b1716" font-weight="700" letter-spacing="1.5" >TOOLKIT</text><g class="wide" style="--t:.1s"><line x1="140.7" y1="37.0" x2="420.0" y2="37.0" stroke="#d6cdbf" stroke-width="1.2"/></g><g clip-path="url(#ty1)"><text x="20.0" y="92.0" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" xml:space="preserve" style="white-space:pre"><tspan fill="#1b1716">Java        </tspan><tspan fill="#3f6273">████████████</tspan><tspan fill="#d6cdbf">░░░░░░░░░░░░░░░░</tspan><tspan fill="#5a524b">  41%</tspan></text><rect x="386.5" y="78.5" width="376.5" height="19.6" fill="#efebe3" class="type" style="--dx:-366.5px;--t:0.20s;--d:0.90s;animation-timing-function:steps(45)"/></g><g clip-path="url(#ty2)"><text x="20.0" y="118.0" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" xml:s