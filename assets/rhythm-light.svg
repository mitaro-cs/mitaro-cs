<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 678" width="888" height="678" role="img" aria-label="02 Rhythm: 35% of my commits land after 22:00 Moscow time. Peak hour 14:00, longest streak 5 days, busiest day Thursday." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>02 Rhythm: 35% of my commits land after 22:00 Moscow time. Peak hour 14:00, longest streak 5 days, busiest day Thursday.</title><desc>Commits by weekday as ASCII bars, and a day of commits hour by hour under a sky that changes from night to morning, day and evening, with a cursor carrying the sun by day and the moon by night.</desc><defs><style>text{font-variant-numeric:tabular-nums}.lift,.roll,.fade,.wide,.grow,.packet,.pulse,.type,.shine,.wave,.ripple,.draw{animation-delay:var(--t,0s)}@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}.draw{animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}@keyframes lift{from{transform:translateY(var(--dy))}to{transform:none}}.lift{animation:lift 1s cubic-bezier(.2,.8,.2,1) both}@keyframes roll{from{transform:translateY(var(--from))}to{transform:none}}.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .7s ease-out both}@keyframes wide{from{transform:scaleX(0)}to{transform:none}}.wide{transform-box:fill-box;transform-origin:0 50%;animation:wide 1s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scale(0)}to{transform:none}}.grow{transform-box:view-box;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes spin{to{transform:rotate(360deg)}}.sweep{transform-box:view-box;animation:spin 14s linear infinite}@keyframes flow{from{stroke-dashoffset:var(--start)}to{stroke-dashoffset:var(--end)}}.packet{animation:flow 2.6s cubic-bezier(.45,0,.55,1) infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes tick{to{transform:translateX(var(--shift))}}.ticker{animation:tick var(--d) linear infinite}@keyframes type{from{transform:translateX(var(--dx))}to{transform:none}}.type{animation:type var(--d,1s) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}.rest{opacity:0}@keyframes shine{0%{transform:translateX(var(--from))}40%,100%{transform:translateX(var(--to))}}.shine{animation:shine 6s cubic-bezier(.45,0,.55,1) infinite}@keyframes wave{0%,100%{opacity:1}50%{opacity:.4}}.wave{animation:wave 3.6s ease-in-out infinite}@keyframes ripple{0%{transform:scale(.15);opacity:.9}75%,100%{transform:scale(1);opacity:0}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.6s cubic-bezier(.2,.7,.3,1) infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:view-box;transform-origin:0 0;animation:orbit 10s linear infinite}@keyframes depth{0%,40%{opacity:1}50%,90%{opacity:.15}100%{opacity:1}}.depth{animation:depth 10s linear infinite}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}@keyframes light{0%,6%{opacity:1}14%,100%{opacity:.45}}@media (prefers-reduced-motion:reduce){.hour{animation:none!important}}@keyframes walk{from{transform:translateX(0)}to{transform:translateX(808px)}}@keyframes sunup{0%,24%{opacity:0}26%,74%{opacity:1}76%,100%{opacity:0}}@keyframes moonup{0%,24%{opacity:1}26%,74%{opacity:0}76%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.cursor{display:none}}</style><clipPath id="hl1"><rect x="0" y="60" width="888" height="139"/></clipPath><linearGradient id="gg3"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="gm2" maskUnits="userSpaceOnUse" x="0" y="0" width="888" height="308"><rect x="928" y="60" width="174" height="149" fill="url(#gg3)" transform="skewX(-18)" class="shine" style="--from:-1142px;--to:0px;--t:1.7s"/></mask><clipPath id="ty4"><rect x="475.