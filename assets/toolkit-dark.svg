<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 532" width="888" height="532" role="img" aria-label="04 Toolkit. Code by language: Java 41%, Svelte 23%, Python 12%, TypeScript 11%, CSS 4%, Other 9%. Languages: Java, Python, TypeScript, JavaScript, Rust, SQL. Frameworks: Spring Boot, Svelte, Flask, Tauri. Tools: SQLite, Docker, Git and Actions, Linux, Figma, Zed." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>04 Toolkit. Code by language: Java 41%, Svelte 23%, Python 12%, TypeScript 11%, CSS 4%, Other 9%. Languages: Java, Python, TypeScript, JavaScript, Rust, SQL. Frameworks: Spring Boot, Svelte, Flask, Tauri. Tools: SQLite, Docker, Git and Actions, Linux, Figma, Zed.</title><desc>Language shares drawn as ASCII bars of block glyphs that fill in, then what I use.</desc><defs><style>text{font-variant-numeric:tabular-nums}.lift,.roll,.fade,.wide,.grow,.packet,.pulse,.type,.shine,.wave,.ripple,.draw{animation-delay:var(--t,0s)}@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}.draw{animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}@keyframes lift{from{transform:translateY(var(--dy))}to{transform:none}}.lift{animation:lift 1s cubic-bezier(.2,.8,.2,1) both}@keyframes roll{from{transform:translateY(var(--from))}to{transform:none}}.roll{animation:roll 1.8s cubic-bezier(.16,1,.3,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .7s ease-out both}@keyframes wide{from{transform:scaleX(0)}to{transform:none}}.wide{transform-box:fill-box;transform-origin:0 50%;animation:wide 1s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scale(0)}to{transform:none}}.grow{transform-box:view-box;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes spin{to{transform:rotate(360deg)}}.sweep{transform-box:view-box;animation:spin 14s linear infinite}@keyframes flow{from{stroke-dashoffset:var(--start)}to{stroke-dashoffset:var(--end)}}.packet{animation:flow 2.6s cubic-bezier(.45,0,.55,1) infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes tick{to{transform:translateX(var(--shift))}}.ticker{animation:tick var(--d) linear infinite}@keyframes type{from{transform:translateX(var(--dx))}to{transform:none}}.type{animation:type var(--d,1s) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}.rest{opacity:0}@keyframes shine{0%{transform:translateX(var(--from))}40%,100%{transform:translateX(var(--to))}}.shine{animation:shine 6s cubic-bezier(.45,0,.55,1) infinite}@keyframes wave{0%,100%{opacity:1}50%{opacity:.4}}.wave{animation:wave 3.6s ease-in-out infinite}@keyframes ripple{0%{transform:scale(.15);opacity:.9}75%,100%{transform:scale(1);opacity:0}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.6s cubic-bezier(.2,.7,.3,1) infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-box:view-box;transform-origin:0 0;animation:orbit 10s linear infinite}@keyframes depth{0%,40%{opacity:1}50%,90%{opacity:.15}100%{opacity:1}}.depth{animation:depth 10s linear infinite}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}</style><clipPath id="ty1"><rect x="39.0" y="77.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty2"><rect x="39.0" y="105.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty3"><rect x="39.0" y="133.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty4"><rect x="39.0" y="161.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty5"><rect x="39.0" y="189.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty6"><rect x="39.0" y="217.0" width="615.0" height="21.8"/></clipPath></defs><rect x="0.0" y="0.0" width="888.0" height="532.0" fill="#170d1f" /><text x="40.0" y="42.0" font-size="13.5" fill="#ff8a3d" font-weight="700" letter-spacing="1.5" >04</text><text x="74.0" y="42.0" font-size="13.5" fill="#fff1e8" font-weight="70