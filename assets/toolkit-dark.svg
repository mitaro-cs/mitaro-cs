ansform:translateX(var(--shift))}}.ticker{animation:tick var(--d) linear infinite}@keyframes type{from{transform:translateX(var(--dx))}to{transform:none}}.type{animation:type var(--d,1s) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}.rest{opacity:0}@media (prefers-reduced-motion:reduce){[class]{animation:none!important}}</style><clipPath id="ty1"><rect x="39.0" y="77.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty2"><rect x="39.0" y="105.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty3"><rect x="39.0" y="133.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty4"><rect x="39.0" y="161.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty5"><rect x="39.0" y="189.0" width="615.0" height="21.8"/></clipPath><clipPath id="ty6"><rect x="39.0" y="217.0" width="615.0" height="21.8"/></clipPath></defs><rect x="0.0" y="0.0" width="888.0" height="532.0" fill="#141112" /><text x="40.0" y="42.0" font-size="13.5" fill="#a2bbc5" font-weight="700" letter-spacing="1.5" >03</text><text x="74.0" y="42.0" font-size="13.5" fill="#eef1ee" font-weight="700" letter-spacing="1.5" >TOOLKIT</text><g class="wide" style="--t:.1s"><line x1="160.7" y1="37.0" x2="550.4" y2="37.0" stroke="#302a27" stroke-width="1.2"/></g><text x="848.0" y="42.0" font-size="12.5" fill="#bdaea3" font-weight="600" text-anchor="end" letter-spacing="1.5" >4.1 MB OF CODE IN 9 REPOSITORIES</text><g clip-path="url(#ty1)"><text x="40.0" y="92.0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" xml:space="preserve" style="white-space:pre"><tspan fill="#eef1ee">Java        </tspan><tspan fill="#a2bbc5">█████████████████████</tspan><tspan fill="#302a27">░░░░░░░░░░░░░░░░░░░░░░░░░░░░░</tspan><tspan fill="#bdaea3">  41%</tspan></text><rect x="645.0" y="77.0" width="615.0" height="21.8" fill="#141112" class="type" style="--dx:-605.0px;--t:0.20s;--d:1.34s;animation-timing-function:step