<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 470" width="888" height="470" role="img" aria-label="01 Campus: a site and an app for one study group that lives on the group leader's own computer. 189 Java classes, 163 Svelte components, 103 test files, 35 DB migrations, 30 versions, v1.0.1 latest release." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>01 Campus: a site and an app for one study group that lives on the group leader's own computer. 189 Java classes, 163 Svelte components, 103 test files, 35 DB migrations, 30 versions, v1.0.1 latest release.</title><desc>How it works: the host computer runs the server with SQLite and encrypted files; a free HTTPS tunnel gives the group a link; every phone and laptop keeps its own copy and works offline.</desc><defs><style>text{font-variant-numeric:tabular-nums}</style></defs><rect x="0.0" y="0.0" width="888.0" height="470.0" fill="#121212" /><text x="40.0" y="40.0" font-size="12" fill="#ff6a47" font-weight="700" letter-spacing="1.6" >01</text><text x="70.0" y="40.0" font-size="12" fill="#efece6" font-weight="700" letter-spacing="1.6" >FEATURE</text><line x1="154.7" y1="36.0" x2="594.5" y2="36.0" stroke="#2f2e2b" stroke-width="1"/><text x="848.0" y="40.0" font-size="11" fill="#9a968e" font-weight="600" text-anchor="end" letter-spacing="1.6" >GITHUB.COM/MITARO-CS/CAMPUS</text><text x="37.0" y="128.0" font-size="76" fill="#efece6" font-weight="700" letter-spacing="-2.5" >Campus</text><text x="40.0" y="170.0" font-size="16.5" fill="#efece6" >A site and an app for one study group: homework,</text><text x="40.0" y="194.8" font-size="16.5" fill="#efece6" >a schedule from an .ics file, news and files. It lives</text><text x="40.0" y="219.5" font-size="16.5" fill="#efece6" >on the group leader's own computer, and every</text><text x="40.0" y="244.2" font-size="16.5" fill="#efece6" >phone keeps a copy that syncs when the host is</text><text x="40.0" y="269.0" font-size="16.5" fill="#efece6" >back on.</text><text x="476.0" y="84.0" font-size="11" fill="#9a968e" font-weight="600" letter-spacing="1.6" >HOW IT WORKS</text><rect x="476.0" y="96.0" width="372.0" height="76.0" fill="none" stroke="#efece6" stroke-width="1.2" /><text x="490.0" y="118.0" font-size="10.5" fill="#ff6a47" font-weight="700" letter-spacing="1.6" >HOST · GROUP LEADER'S COMPUTER</text><text x="490.0" y="142.0" font-size="14.5" fill="#efece6" font-weight="600" >Spring Boot · SQLite · AES-256-GCM files</text><text x="490.0" y="161.0" font-size="12.5" fill="#9a968e" >Windows or macOS app, updates in one click</text><line x1="662.0" y1="172.0" x2="662.0" y2="198.0" stroke="#ff6a47" stroke-width="1.5"/><line x1="534.7" y1="198.0" x2="789.3" y2="198.0" stroke="#ff6a47" stroke-width="1.5"/><text x="672.0" y="190.0" font-size="11.5" fill="#9a968e" >HTTPS tunnel: one link, one QR code</text><line x1="534.7" y1="198.0" x2="534.7" y2="214.0" stroke="#ff6a47" stroke-width="1.5"/><rect x="476.0" y="214.0" width="117.3" height="58.0" fill="none" stroke="#efece6" stroke-width="1.2" /><text x="488.0" y="238.0" font-size="14.5" fill="#efece6" font-weight="600" >Phone</text><text x="488.0" y="258.0" font-size="12.5" fill="#9a968e" >own copy</text><line x1="662.0" y1="198.0" x2="662.0" y2="214.0" stroke="#ff6a47" stroke-width="1.5"/><rect x="603.3" y="214.0" width="117.3" height="58.0" fill="none" stroke="#efece6" stroke-width="1.2" /><text x="615.3" y="238.0" font-size="14.5" fill="#efece6" font-weight="600" >Phone</text><text x="615.3" y="258.0" font-size="12.5" fill="#9a968e" >works offline</text><line x1="789.3" y1="198.0" x2="789.3" y2="214.0" stroke="#ff6a47" stroke-width="1.5"/><rect x="730.7" y="214.0" width="117.3" height="58.0" fill="none" stroke="#efece6" stroke-width="1.2" /><text x="742.7" y="238.0" font-size="14.5" fill="#efece6" font-weight="600" >Laptop</text><text x="742.7" y="258.0" font-size="12.5" fill="#9a968e" >syncs later</text><line x1="40.0" y1=