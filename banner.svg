<svg width="900" height="400" viewBox="0 0 900 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03060c"/>
      <stop offset="60%" stop-color="#081120"/>
      <stop offset="100%" stop-color="#0d1c2e"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3450"/>
      <stop offset="100%" stop-color="#0a1420" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="400" fill="url(#sky)"/>

  <!-- aurora -->
  <path d="M0 26 C 263 78, 413 9, 615 61 C 750 96, 825 52, 885 78 L885 131 C 750 96, 600 139, 420 96 C 263 61, 150 104, 0 78 Z" fill="url(#aurora1)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M0 78 C 225 122, 450 61, 675 113 C 788 139, 863 104, 900 122 L900 165 C 750 139, 563 174, 375 131 C 225 100, 113 139, 0 122 Z" fill="url(#aurora2)">
    <animate attributeName="opacity" values="1;0.5;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- moon -->
  <circle cx="795" cy="63" r="21" fill="#dcefff" opacity="0.9"/>
  <circle cx="803" cy="56" r="19" fill="#03060c" opacity="0.92"/>

  <!-- stars -->
  <g fill="#bfe8ff">
    <circle cx="90" cy="44" r="1.2" opacity="0.7"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="195" cy="30" r="1" opacity="0.5"><animate attributeName="opacity" values=".6;.15;.6" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="323" cy="50" r="1.1" opacity="0.6"><animate attributeName="opacity" values=".3;.9;.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="31" r="1" opacity="0.5"><animate attributeName="opacity" values=".7;.2;.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="638" cy="45" r="1.2" opacity="0.6"><animate attributeName="opacity" values=".25;.85;.25" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="735" cy="26" r="1" opacity="0.5"><animate attributeName="opacity" values=".6;.2;.6" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- falling snow -->
  <g fill="#bfe8ff">
    <circle cx="135" cy="70" r="1.4"><animate attributeName="cy" values="52;392" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;.6;0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="293" cy="44" r="1"><animate attributeName="cy" values="35;392" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;.5;0" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="458" cy="78" r="1.5"><animate attributeName="cy" values="61;392" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;.6;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="615" cy="52" r="1.1"><animate attributeName="cy" values="39;392" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;.5;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="758" cy="74" r="1.4"><animate attributeName="cy" values="57;392" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;.6;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="848" cy="48" r="1"><animate attributeName="cy" values="35;392" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;.5;0" dur="16s" repeatCount="indefinite"/></circle>
  </g>

  <!-- quote block (left) -->
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="10" fill="#5c7a99" letter-spacing="0.8">
    <text x="53" y="103">Cold mind.</text>
    <text x="53" y="122">Clean code.</text>
    <text x="53" y="141">Systems that hold</text>
    <text x="53" y="160">under any storm.</text>
    <text x="53" y="181" fill="#33506e" font-size="9">— mitaro</text>
  </g>

  <!-- code block (right) — mirrors the left block: same margin from its edge -->
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.4" text-anchor="end">
    <text x="848" y="103" fill="#5c7a99">mind = <tspan fill="#7dd3fc">"cold"</tspan></text>
    <text x="848" y="122" fill="#5c7a99"><tspan fill="#38bdf8">while</tspan> focus:</text>
    <text x="848" y="141" fill="#5c7a99">    build(<tspan fill="#7dd3fc">clean</tspan>=True)</text>
    <text x="848" y="160" fill="#5c7a99">    ship()</text>
  </g>

  <!-- name -->
  <text x="450" y="213" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="44" font-weight="700" letter-spacing="10" fill="#eaf5ff">
    OMAR · MITARO
  </text>

  <rect x="308" y="236" width="285" height="2" fill="url(#ice)"/>

  <text x="450" y="262" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="500" letter-spacing="6" fill="#7dd3fc">
    JUNIOR PYTHON &amp; FRONTEND DEVELOPER
  </text>

  <text x="450" y="285" text-anchor="middle"
        font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace"
        font-size="10" letter-spacing="2" fill="#5c7a99">
    CS STUDENT · MTUCI · CLEAN DIGITAL TOOLS · COLD MINIMAL UI
  </text>

  <!-- ridges -->
  <path d="M0 364 L105 342 L180 359 L278 336 L353 357 L450 333 L548 359 L645 341 L735 360 L818 346 L900 357 L900 400 L0 400 Z" fill="url(#peakGrad)" opacity="0.6"/>
  <path d="M0 377 L128 353 L240 374 L375 345 L495 371 L630 352 L750 372 L855 355 L900 368 L900 400 L0 400 Z" fill="#0d1a2a"/>
  <path d="M278 336 L297 348 L287 351 L305 362 M450 333 L470 345 L459 348 L477 359 M645 341 L665 353 L654 356 L672 367" stroke="#3d5a78" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>
