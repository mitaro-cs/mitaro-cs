<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808"/>
      <stop offset="50%" style="stop-color:#0e0e0e"/>
      <stop offset="100%" style="stop-color:#060606"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="60%" style="stop-color:#dddddd"/>
      <stop offset="100%" style="stop-color:#888888"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#080808;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#080808;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#080808;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#080808;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="textGlow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="160" cy="160" rx="280" ry="200" fill="#ffffff" opacity="0.025" filter="url(#softBlur)"/>
  <ellipse cx="600" cy="100" rx="400" ry="150" fill="#ffffff" opacity="0.015" filter="url(#softBlur)"/>
  <ellipse cx="1040" cy="180" rx="260" ry="180" fill="#ffffff" opacity="0.02" filter="url(#softBlur)"/>

  <!-- Fine grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.4">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>

  <!-- Left code column -->
  <g font-family="JetBrains Mono, Courier New, monospace" font-size="10.5">
    <text x="28" y="52" fill="#4ade80" opacity="0.55">class</text>
    <text x="65" y="52" fill="#ffffff" opacity="0.4"> Mitaro:</text>
    <text x="28" y="70" fill="#60a5fa" opacity="0.4">    name</text>
    <text x="85" y="70" fill="#ffffff" opacity="0.25">     = "Omar"</text>
    <text x="28" y="88" fill="#60a5fa" opacity="0.35">    role</text>
    <text x="85" y="88" fill="#ffffff" opacity="0.2">     = "Developer"</text>
    <text x="28" y="106" fill="#60a5fa" opacity="0.3">    uni</text>
    <text x="85" y="106" fill="#ffffff" opacity="0.18">      = "MTUCI"</text>
    <text x="28" y="130" fill="#f97316" opacity="0.45">    def</text>
    <text x="60" y="130" fill="#facc15" opacity="0.4"> build(self):</text>
    <text x="28" y="148" fill="#ffffff" opacity="0.15">        return</text>
    <text x="95" y="148" fill="#a78bfa" opacity="0.35"> clean_code()</text>
    <text x="28" y="174" fill="#6b7280" opacity="0.5"># minimal · dark</text>
    <text x="28" y="192" fill="#6b7280" opacity="0.35"># functional · no noise</text>
    <text x="28" y="216" fill="#4ade80" opacity="0.3">import</text>
    <text x="72" y="216" fill="#ffffff" opacity="0.2"> passion</text>
    <text x="28" y="234" fill="#6b7280" opacity="0.25">from code import art</text>
    <text x="28" y="258" fill="#f97316" opacity="0.3">git commit</text>
    <text x="99" y="258" fill="#ffffff" opacity="0.2"> -m "ship it"</text>
    <text x="28" y="276" fill="#60a5fa" opacity="0.25">docker compose up -d</text>
    <text x="28" y="294" fill="#4ade80" opacity="0.2">✓ deployed</text>
  </g>

  <!-- Right code column -->
  <g font-family="JetBrains Mono, Courier New, monospace" font-size="10.5">
    <text x="910" y="52" fill="#f97316" opacity="0.4">VantaVault</text>
    <text x="1000" y="52" fill="#6b7280" opacity="0.3"> — AES vault</text>
    <text x="910" y="70" fill="#a78bfa" opacity="0.35">AetherCloud</text>
    <text x="1008" y="70" fill="#6b7280" opacity="0.25"> — self-hosted</text>
    <text x="910" y="88" fill="#facc15" opacity="0.4">KworkingSystem</text>
    <text x="1025" y="88" fill="#6b7280" opacity="0.25"> — cowork</text>
    <text x="910" y="106" fill="#4ade80" opacity="0.3">Mouros</text>
    <text x="958" y="106" fill="#6b7280" opacity="0.22"> — cs exam prep</text>
    <text x="910" y="130" fill="#6b7280" opacity="0.45">────────────────────</text>
    <text x="910" y="150" fill="#60a5fa" opacity="0.4">Python</text>
    <text x="960" y="150" fill="#6b7280" opacity="0.25"> Flask SQLite</text>
    <text x="910" y="168" fill="#f97316" opacity="0.35">JS</text>
    <text x="925" y="168" fill="#6b7280" opacity="0.25"> HTML CSS Docker</text>
    <text x="910" y="186" fill="#a78bfa" opacity="0.3">AES</text>
    <text x="935" y="186" fill="#6b7280" opacity="0.22"> PBKDF2 PWA CI/CD</text>
    <text x="910" y="210" fill="#6b7280" opacity="0.4">────────────────────</text>
    <text x="910" y="230" fill="#4ade80" opacity="0.35">status</text>
    <text x="954" y="230" fill="#ffffff" opacity="0.3">: open to work</text>
    <text x="910" y="248" fill="#facc15" opacity="0.3">location</text>
    <text x="964" y="248" fill="#ffffff" opacity="0.22">: Moscow, RU</text>
    <text x="910" y="266" fill="#60a5fa" opacity="0.25">team</text>
    <text x="940" y="266" fill="#ffffff" opacity="0.2">: fast to integrate</text>
    <text x="910" y="284" fill="#f97316" opacity="0.22">style</text>
    <text x="940" y="284" fill="#ffffff" opacity="0.18">: dark · minimal</text>
  </g>

  <!-- Left fade overlay -->
  <rect x="0" y="0" width="320" height="320" fill="url(#fadeL)"/>
  <!-- Right fade overlay -->
  <rect x="880" y="0" width="320" height="320" fill="url(#fadeR)"/>

  <!-- Center accent bar top -->
  <rect x="360" y="58" width="480" height="0.5" fill="url(#accentLine)" opacity="0.3"/>

  <!-- Center decorative dots row -->
  <g fill="#ffffff" opacity="0.2">
    <circle cx="370" cy="72" r="1.8"/>
    <circle cx="383" cy="72" r="1.8"/>
    <circle cx="396" cy="72" r="1.8"/>
  </g>
  <g fill="#ffffff" opacity="0.2">
    <circle cx="804" cy="72" r="1.8"/>
    <circle cx="817" cy="72" r="1.8"/>
    <circle cx="830" cy="72" r="1.8"/>
  </g>

  <!-- Main name with glow -->
  <text x="600" y="172" font-family="JetBrains Mono, Courier New, monospace" font-size="72" font-weight="700" fill="#ffffff" opacity="0.06" text-anchor="middle" filter="url(#softBlur)">MITARO</text>
  <text x="600" y="172" font-family="JetBrains Mono, Courier New, monospace" font-size="72" font-weight="700" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="2" filter="url(#textGlow)">MITARO</text>

  <!-- Subtitle line -->
  <rect x="360" y="186" width="480" height="0.5" fill="url(#accentLine)" opacity="0.25"/>

  <!-- Role badges -->
  <g font-family="JetBrains Mono, Courier New, monospace">
    <!-- Badge 1 -->
    <rect x="368" y="198" width="120" height="20" rx="3" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.2"/>
    <text x="428" y="212" font-size="10" fill="#ffffff" opacity="0.6" text-anchor="middle" letter-spacing="1">PYTHON</text>
    <!-- Badge 2 -->
    <rect x="500" y="198" width="120" height="20" rx="3" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.2"/>
    <text x="560" y="212" font-size="10" fill="#ffffff" opacity="0.6" text-anchor="middle" letter-spacing="1">FRONTEND</text>
    <!-- Badge 3 -->
    <rect x="632" y="198" width="120" height="20" rx="3" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.2"/>
    <text x="692" y="212" font-size="10" fill="#ffffff" opacity="0.6" text-anchor="middle" letter-spacing="1">SECURITY</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="248" font-family="JetBrains Mono, Courier New, monospace" font-size="11" fill="#ffffff" opacity="0.3" text-anchor="middle" letter-spacing="3">MTUCI  ·  MOSCOW  ·  CS STUDENT  ·  OPEN TO WORK</text>

  <!-- Bottom accent -->
  <rect x="360" y="262" width="480" height="0.5" fill="url(#accentLine)" opacity="0.15"/>

  <!-- Corner brackets with extra lines -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.35">
    <line x1="340" y1="30" x2="340" y2="72"/><line x1="340" y1="30" x2="382" y2="30"/>
    <line x1="340" y1="36" x2="352" y2="36"/>
    <line x1="860" y1="30" x2="860" y2="72"/><line x1="860" y1="30" x2="818" y2="30"/>
    <line x1="860" y1="36" x2="848" y2="36"/>
    <line x1="340" y1="290" x2="340" y2="248"/><line x1="340" y1="290" x2="382" y2="290"/>
    <line x1="340" y1="284" x2="352" y2="284"/>
    <line x1="860" y1="290" x2="860" y2="248"/><line x1="860" y1="290" x2="818" y2="290"/>
    <line x1="860" y1="284" x2="848" y2="284"/>
  </g>

  <!-- Outer border -->
  <rect x="0" y="0" width="1200" height="1" fill="#ffffff" opacity="0.12"/>
  <rect x="0" y="319" width="1200" height="1" fill="#ffffff" opacity="0.06"/>
</svg>