<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03060c"/>
      <stop offset="60%" stop-color="#081120"/>
      <stop offset="100%" stop-color="#0d1c2e"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3450"/>
      <stop offset="100%" stop-color="#0a1420" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" fill="url(#sky)"/>

  <!-- aurora -->
  <path d="M0 30 C 350 90, 550 10, 820 70 C 1000 110, 1100 60, 1180 90 L1180 150 C 1000 110, 800 160, 560 110 C 350 70, 200 120, 0 90 Z" fill="url(#aurora1)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M0 90 C 300 140, 600 70, 900 130 C 1050 160, 1150 120, 1200 140 L1200 190 C 1000 160, 750 200, 500 150 C 300 115, 150 160, 0 140 Z" fill="url(#aurora2)">
    <animate attributeName="opacity" values="1;0.5;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- moon -->
  <circle cx="1060" cy="72" r="26" fill="#dcefff" opacity="0.9"/>
  <circle cx="1070" cy="64" r="24" fill="#03060c" opacity="0.92"/>

  <!-- stars -->
  <g fill="#bfe8ff">
    <circle cx="120" cy="50" r="1.4" opacity="0.7"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="34" r="1.1" opacity="0.5"><animate attributeName="opacity" values=".6;.15;.6" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="58" r="1.3" opacity="0.6"><animate attributeName="opacity" values=".3;.9;.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="36" r="1.2" opacity="0.5"><animate attributeName="opacity" values=".7;.2;.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="52" r="1.4" opacity="0.6"><animate attributeName="opacity" values=".25;.85;.25" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="30" r="1.1" opacity="0.5"><animate attributeName="opacity" values=".6;.2;.6" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- falling snow -->
  <g fill="#bfe8ff">
    <circle cx="180" cy="80" r="1.6"><animate attributeName="cy" values="60;450" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;.6;0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="50" r="1.2"><animate attributeName="cy" values="40;450" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;.5;0" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="90" r="1.8"><animate attributeName="cy" values="70;450" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;.6;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="60" r="1.3"><animate attributeName="cy" values="45;450" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;.5;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="85" r="1.6"><animate attributeName="cy" values="65;450" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;.6;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="55" r="1.2"><animate attributeName="cy" values="40;450" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;.5;0" dur="16s" repeatCount="indefinite"/></circle>
  </g>

  <!-- quote block (left) -->
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#5c7a99" letter-spacing="1">
    <text x="70" y="118">Cold mind.</text>
    <text x="70" y="140">Clean code.</text>
    <text x="70" y="162">Systems that hold</text>
    <text x="70" y="184">under any storm.</text>
    <text x="70" y="208" fill="#33506e" font-size="11">— mitaro</text>
  </g>

  <!-- code block (right) — mirrors the left block: same 70px margin from its edge -->
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.5" text-anchor="end">
    <text x="1130" y="118" fill="#5c7a99">mind = <tspan fill="#7dd3fc">"cold"</tspan></text>
    <text x="1130" y="140" fill="#5c7a99"><tspan fill="#38bdf8">while</tspan> focus:</text>
    <text x="1130" y="162" fill="#5c7a99">    build(<tspan fill="#7dd3fc">clean</tspan>=True)</text>
    <text x="1130" y="184" fill="#5c7a99">    ship()</text>
  </g>

  <!-- name -->
  <text x="600" y="245" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="54" font-weight="700" letter-spacing="12" fill="#eaf5ff">
    OMAR · MITARO
  </text>

  <rect x="410" y="271" width="380" height="2" fill="url(#ice)"/>

  <text x="600" y="301" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="16" font-weight="500" letter-spacing="7" fill="#7dd3fc">
    JUNIOR PYTHON &amp; FRONTEND DEVELOPER
  </text>

  <text x="600" y="327" text-anchor="middle"
        font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace"
        font-size="12" letter-spacing="3" fill="#5c7a99">
    CS STUDENT · MTUCI · CLEAN DIGITAL TOOLS · COLD MINIMAL UI
  </text>

  <!-- ridges (kept clear below y=380, well under the tagline) -->
  <path d="M0 418 L140 393 L240 413 L370 386 L470 410 L600 383 L730 412 L860 392 L980 414 L1090 398 L1200 410 L1200 460 L0 460 Z" fill="url(#peakGrad)" opacity="0.6"/>
  <path d="M0 433 L170 406 L320 430 L500 396 L660 426 L840 404 L1000 428 L1140 408 L1200 423 L1200 460 L0 460 Z" fill="#0d1a2a"/>
  <path d="M370 386 L396 400 L382 403 L406 416 M600 383 L626 397 L612 400 L636 412 M860 392 L886 406 L872 409 L896 422" stroke="#3d5a78" stroke-width="2" fill="none" opacity="0.7"/>
</svg>
