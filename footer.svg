<svg viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b1220;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="150" fill="url(#footerGradient)"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#7dd3fc" stroke-width="2" opacity="0.3"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="75" r="40" fill="#7dd3fc" opacity="0.05"/>
  <circle cx="1100" cy="75" r="50" fill="#7dd3fc" opacity="0.04"/>
  
  <!-- Pattern -->
  <g opacity="0.1">
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Center accent -->
  <line x1="400" y1="30" x2="800" y2="30" stroke="#7dd3fc" stroke-width="1.5" opacity="0.2"/>
  <line x1="400" y1="120" x2="800" y2="120" stroke="#7dd3fc" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Corner details -->
  <path d="M 20 20 L 50 20 L 50 50" stroke="#7dd3fc" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 1180 20 L 1150 20 L 1150 50" stroke="#7dd3fc" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 20 130 L 50 130 L 50 100" stroke="#7dd3fc" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 1180 130 L 1150 130 L 1150 100" stroke="#7dd3fc" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>