name: Update profile graphics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [miaro]
    paths:
      - "scripts/*.py"
      - "scripts/fonts/**"
      - "scripts/icons/**"
      - "scripts/src/**"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: Fetch numbers from the GitHub API
        run: python scripts/fetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild the SVG panels
        run: python scripts/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update profile stats"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
