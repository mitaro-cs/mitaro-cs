<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="workspaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f6fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f1f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#workspaceGradient)"/>
  
  <!-- Mountain background -->
  <path d="M 0 150 L 100 80 L 200 120 L 300 60 L 400 140 L 400 300 L 0 300 Z" fill="#e0ecf5" opacity="0.4"/>
  <path d="M 100 80 L 90 95 L 110 95 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 300 60 L 280 90 L 320 90 Z" fill="#ffffff" opacity="0.85"/>
  
  <!-- Monitor frame -->
  <rect x="50" y="40" width="300" height="200" fill="#ffffff" stroke="#2d5a7b" stroke-width="2" rx="4"/>
  
  <!-- Screen content -->
  <rect x="55" y="45" width="290" height="190" fill="#f8fbfd"/>
  
  <!-- Code lines -->
  <line x1="65" y1="60" x2="320" y2="60" stroke="#3d6fa5" stroke-width="1.5" opacity="0.7"/>
  <line x1="65" y1="75" x2="280" y2="75" stroke="#3d6fa5" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="90" x2="300" y2="90" stroke="#3d6fa5" stroke-width="1.5" opacity="0.7"/>
  <line x1="65" y1="110" x2="260" y2="110" stroke="#3d6fa5" stroke-width="1.5" opacity="0.5"/>
  <line x1="65" y1="125" x2="290" y2="125" stroke="#3d6fa5" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="140" x2="270" y2="140" stroke="#3d6fa5" stroke-width="1.5" opacity="0.7"/>
  <line x1="65" y1="160" x2="310" y2="160" stroke="#3d6fa5" stroke-width="1.5" opacity="0.5"/>
  <line x1="65" y1="175" x2="250" y2="175" stroke="#3d6fa5" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="190" x2="295" y2="190" stroke="#3d6fa5" stroke-width="1.5" opacity="0.7"/>
  <line x1="65" y1="205" x2="280" y2="205" stroke="#3d6fa5" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Stand -->
  <rect x="120" y="240" width="160" height="8" fill="#2d5a7b" opacity="0.3" rx="2"/>
  <rect x="140" y="248" width="120" height="4" fill="#2d5a7b" opacity="0.2" rx="1"/>
</svg>