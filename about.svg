<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="workspaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1220;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2847;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#workspaceGradient)"/>
  
  <!-- Background elements -->
  <circle cx="350" cy="50" r="60" fill="#7dd3fc" opacity="0.08"/>
  <circle cx="50" cy="250" r="80" fill="#7dd3fc" opacity="0.06"/>
  
  <!-- Monitor frame -->
  <rect x="50" y="40" width="300" height="200" fill="#0f1729" stroke="#7dd3fc" stroke-width="2" rx="4"/>
  
  <!-- Screen content -->
  <rect x="55" y="45" width="290" height="190" fill="#0a0f1a"/>
  
  <!-- Code lines -->
  <line x1="65" y1="60" x2="320" y2="60" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
  <line x1="65" y1="75" x2="280" y2="75" stroke="#7dd3fc" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="90" x2="300" y2="90" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
  <line x1="65" y1="110" x2="260" y2="110" stroke="#7dd3fc" stroke-width="1" opacity="0.4"/>
  <line x1="65" y1="125" x2="290" y2="125" stroke="#7dd3fc" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="140" x2="270" y2="140" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
  <line x1="65" y1="160" x2="310" y2="160" stroke="#7dd3fc" stroke-width="1" opacity="0.4"/>
  <line x1="65" y1="175" x2="250" y2="175" stroke="#7dd3fc" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="190" x2="295" y2="190" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
  <line x1="65" y1="205" x2="280" y2="205" stroke="#7dd3fc" stroke-width="1" opacity="0.4"/>
  
  <!-- Stand -->
  <rect x="120" y="240" width="160" height="8" fill="#7dd3fc" opacity="0.3" rx="2"/>
  <rect x="140" y="248" width="120" height="4" fill="#7dd3fc" opacity="0.2" rx="1"/>
</svg>