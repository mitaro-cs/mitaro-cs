<svg width="440" height="340" viewBox="0 0 440 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081120"/>
      <stop offset="100%" stop-color="#0d1c2e"/>
    </linearGradient>
    <linearGradient id="awin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122a44"/>
      <stop offset="100%" stop-color="#0b1a2c"/>
    </linearGradient>
  </defs>

  <rect width="440" height="340" rx="16" fill="url(#abg)"/>
  <rect x="1" y="1" width="438" height="338" rx="15" stroke="#16283e" stroke-width="2" fill="none"/>

  <!-- window with mountains -->
  <rect x="290" y="36" width="118" height="94" rx="8" fill="url(#awin)"/>
  <rect x="290" y="36" width="118" height="94" rx="8" stroke="#22405e" stroke-width="2" fill="none"/>
  <circle cx="384" cy="58" r="9" fill="#dcefff" opacity="0.85"/>
  <path d="M296 112 L318 88 L334 104 L352 80 L372 102 L390 88 L406 104 L406 128 L296 128 Z" fill="#16324e"/>
  <path d="M318 88 L324 95 L320 96 L326 102 M352 80 L358 88 L354 89 L360 95" stroke="#4a6c8e" stroke-width="1.6" fill="none"/>
  <circle cx="310" cy="56" r="1.2" fill="#bfe8ff"><animate attributeName="opacity" values=".3;.9;.3" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="48" r="1" fill="#bfe8ff"><animate attributeName="opacity" values=".8;.25;.8" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="326" cy="66" r="1.4" fill="#bfe8ff"><animate attributeName="cy" values="60;120" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="9s" repeatCount="indefinite"/></circle>

  <!-- desk -->
  <rect x="36" y="238" width="368" height="10" rx="5" fill="#16283e"/>
  <rect x="60" y="248" width="10" height="56" fill="#101f32"/>
  <rect x="370" y="248" width="10" height="56" fill="#101f32"/>

  <!-- monitor left -->
  <g>
    <rect x="52" y="120" width="150" height="96" rx="8" fill="#0a1624" stroke="#22405e" stroke-width="2"/>
    <rect x="112" y="216" width="30" height="12" fill="#101f32"/>
    <rect x="98" y="228" width="58" height="6" rx="3" fill="#16283e"/>
    <!-- code lines -->
    <rect x="64" y="134" width="70" height="6" rx="3" fill="#38bdf8" opacity="0.9"><animate attributeName="width" values="70;96;70" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="64" y="148" width="110" height="6" rx="3" fill="#2b4a6f"/>
    <rect x="76" y="162" width="86" height="6" rx="3" fill="#7dd3fc" opacity="0.8"><animate attributeName="width" values="86;56;86" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="76" y="176" width="98" height="6" rx="3" fill="#2b4a6f"/>
    <rect x="64" y="190" width="62" height="6" rx="3" fill="#38bdf8" opacity="0.7"><animate attributeName="width" values="62;88;62" dur="4.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- monitor right (terminal) -->
  <g>
    <rect x="216" y="132" width="120" height="84" rx="8" fill="#0a1624" stroke="#22405e" stroke-width="2"/>
    <rect x="262" y="216" width="26" height="12" fill="#101f32"/>
    <rect x="250" y="228" width="50" height="6" rx="3" fill="#16283e"/>
    <circle cx="230" cy="144" r="3" fill="#38bdf8"/>
    <circle cx="240" cy="144" r="3" fill="#2b4a6f"/>
    <circle cx="250" cy="144" r="3" fill="#16324e"/>
    <rect x="228" y="156" width="52" height="5" rx="2.5" fill="#2b4a6f"/>
    <rect x="228" y="168" width="76" height="5" rx="2.5" fill="#2b4a6f"/>
    <rect x="228" y="180" width="40" height="5" rx="2.5" fill="#7dd3fc" opacity="0.8"/>
    <rect x="228" y="194" width="8" height="8" fill="#7dd3fc">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- coffee -->
  <g>
    <rect x="356" y="216" width="22" height="22" rx="4" fill="#122438" stroke="#2b4a6f" stroke-width="2"/>
    <path d="M378 222 q10 4 0 10" stroke="#2b4a6f" stroke-width="2" fill="none"/>
    <path d="M362 208 q3 -6 0 -10 M370 208 q3 -6 0 -10" stroke="#31506e" stroke-width="2" fill="none" opacity="0.7">
      <animate attributeName="opacity" values=".7;.2;.7" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- caption -->
  <text x="220" y="290" text-anchor="middle"
        font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace"
        font-size="12" letter-spacing="2" fill="#5c7a99">
    building quietly · shipping steadily
  </text>
  <text x="220" y="312" text-anchor="middle"
        font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace"
        font-size="11" letter-spacing="1.5" fill="#33506e">
    ~/mitaro $ focus --deep
  </text>
</svg>
